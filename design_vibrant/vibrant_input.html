<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ввод · SaveMoney · Vibrant</title>
  <style>
    /* ─── токены (план §2) ────────────────────────────────────────── */
    :root {
      --bg:      oklch(99% 0.002 240);
      --surface: oklch(100% 0 0);
      --fg:      oklch(18% 0.012 250);
      --muted:   oklch(54% 0.012 250);
      --border:  oklch(92% 0.005 250);
      --fg-soft: color-mix(in oklch, var(--fg) 6%, transparent);

      --accent:  #512BD4;
      --expense: #E74C3C;
      --income:  #2ECC71;
      --transfer:#3498DB;

      --accent-soft:   color-mix(in srgb, var(--accent) 10%, transparent);
      --expense-text:  color-mix(in srgb, var(--expense) 82%, black);
      --income-text:   color-mix(in srgb, var(--income) 62%, black);
      --transfer-text: color-mix(in srgb, var(--transfer) 74%, black);
      --accent-light:  color-mix(in srgb, var(--accent) 55%, white);

      --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font-family: var(--font-body); font-size: 15px; line-height: 1.5;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; padding: 0; }
    input { font: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
    .num { font-variant-numeric: tabular-nums; }

    /* ─── корпус iPhone 15 Pro ────────────────────────────────────── */
    .stage {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; padding: 40px 16px;
    }
    .device {
      position: relative; width: 413px; padding: 10px; border-radius: 62px;
      background: linear-gradient(160deg, oklch(40% 0.008 250), oklch(22% 0.006 250));
      box-shadow: 0 40px 90px color-mix(in oklch, var(--fg) 24%, transparent),
        inset 0 0 0 1.5px oklch(55% 0.01 250);
    }
    .side-btn { position: absolute; width: 3.5px; border-radius: 2px; background: oklch(32% 0.008 250); }
    .side-btn.action { left: -3px; top: 176px; height: 26px; }
    .side-btn.vol-up { left: -3px; top: 236px; height: 52px; }
    .side-btn.vol-down { left: -3px; top: 298px; height: 52px; }
    .side-btn.power { right: -3px; top: 262px; height: 78px; }
    .screen {
      position: relative; width: 393px; height: 852px; border-radius: 52px;
      background: var(--bg); overflow: hidden; display: flex; flex-direction: column;
    }
    .stage-caption { font-family: var(--font-mono, ui-monospace, Menlo, monospace); font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
    @media (max-width: 560px) { .device { zoom: 0.82; } }
    @media (max-height: 1000px) { .device { zoom: 0.9; } }

    /* ─── status bar + Dynamic Island ─────────────────────────────── */
    .statusbar {
      position: relative; z-index: 30; flex: none; height: 54px;
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 17px 30px 0;
    }
    .sb-time { font: 600 15px/1.2 var(--font-body); letter-spacing: -0.01em; }
    .sb-icons { display: flex; align-items: center; gap: 7px; color: var(--fg); padding-top: 2px; }
    .island {
      position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
      width: 122px; height: 35px; border-radius: 24px; z-index: 40;
      background: oklch(13% 0.004 250);
    }
    .island::after {
      content: ''; position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%); width: 9px; height: 9px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, oklch(30% 0.03 260), oklch(12% 0.01 260) 70%);
    }

    /* ─── контент ─────────────────────────────────────────────────── */
    .content { flex: 1; overflow-y: auto; padding: 2px 16px 112px; scrollbar-width: none; }
    .content::-webkit-scrollbar { display: none; }

    .balance-line { text-align: center; padding: 4px 0 10px; }
    .balance-line .lbl { font-size: 12px; color: var(--muted); display: block; }
    .balance-line .val { font: 700 20px/1.25 var(--font-display); letter-spacing: -0.02em; }

    /* сегменты расход/доход/перевод */
    .seg { display: flex; background: var(--fg-soft); border-radius: 16px; padding: 3px; }
    .seg button {
      flex: 1; padding: 10px 0; border-radius: 11px; font-size: 14px; font-weight: 600;
      color: var(--muted); transition: background 0.15s ease, color 0.15s ease;
    }
    .seg button:hover { color: var(--fg); }
    .seg button.is-on { background: var(--accent); color: var(--surface); }
    .seg button.is-on:hover { color: var(--surface); }

    /* крупная сумма */
    .amount-box {
      display: flex; align-items: baseline; justify-content: flex-end; gap: 8px;
      min-height: 66px; padding: 6px 12px 2px;
    }
    .amount-val {
      font: 800 42px/1.1 var(--font-display); letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .amount-val.is-empty { color: var(--muted); font-weight: 650; }
    .amount-cur { font: 650 22px/1.1 var(--font-display); color: var(--muted); }
    .caret {
      display: inline-block; width: 2.5px; height: 40px; border-radius: 1px;
      background: var(--accent); margin-left: 3px; vertical-align: -4px;
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
    .amount-box.shake { animation: shake 0.3s ease; }
    @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

    /* клавиатура */
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 10px; }
    .key {
      height: 54px; border-radius: 16px; background: var(--surface);
      border: 1px solid var(--border); font: 600 23px/1 var(--font-display);
      font-variant-numeric: tabular-nums; color: var(--fg);
      transition: background 0.12s ease, transform 0.05s ease;
      display: flex; align-items: center; justify-content: center;
    }
    .key:hover { background: var(--fg-soft); }
    .key:active { transform: scale(0.96); background: var(--accent-soft); }

    /* блоки чипов */
    .group-label { font: 600 12px/1.3 var(--font-body); color: var(--muted); margin: 16px 4px 7px; display: flex; justify-content: space-between; }
    .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: none; display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 13px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface);
      font-size: 13.5px; font-weight: 550; color: var(--fg);
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    }
    .chip:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
    .chip.is-on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 650; }

    /* поля */
    .field { display: flex; flex-direction: column; gap: 5px; margin-top: 12px; }
    .field label { font: 600 12px/1.3 var(--font-body); color: var(--muted); margin-left: 4px; }
    .input {
      width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 12px;
      background: var(--surface); color: var(--fg); font-size: 15px;
      transition: border-color 0.15s ease;
    }
    .input:focus { outline: none; border-color: var(--accent); }
    .guess-hint {
      display: none; align-items: center; gap: 6px; margin: 6px 4px 0;
      font-size: 12px; font-weight: 550; color: var(--accent);
    }
    .guess-hint.is-visible { display: inline-flex; }
    .date-btn {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 11px 14px; border: 1px solid var(--border); border-radius: 12px;
      background: var(--surface); font-size: 15px; transition: border-color 0.15s ease;
    }
    .date-btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
    .date-btn .chev { color: var(--muted); font-size: 13px; }
    #date-input { position: fixed; opacity: 0; pointer-events: none; width: 10px; height: 10px; }

    /* действия */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px 20px; border-radius: 16px; border: 1px solid transparent;
      font-size: 15px; font-weight: 700; letter-spacing: -0.005em;
      transition: background 0.15s ease, transform 0.05s ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--accent); color: var(--surface); width: 100%; margin-top: 16px; }
    .btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, black); }
    .btn-primary.is-saved { background: var(--income); }
    .btn-danger {
      width: 100%; margin-top: 10px; background: color-mix(in srgb, var(--expense) 12%, transparent);
      color: var(--expense-text); font-weight: 650;
    }
    .btn-danger:hover { background: color-mix(in srgb, var(--expense) 18%, transparent); }
    .edit-note { text-align: center; font-size: 12px; color: var(--muted); margin-top: 10px; }

    /* ─── таб-бар ─────────────────────────────────────────────────── */
    .tabbar {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
      display: flex; padding: 6px 10px 22px;
      border-top: 1px solid var(--border);
      background: color-mix(in oklch, var(--bg) 86%, transparent);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .tab {
      flex: 1; min-height: 46px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px;
      border-radius: 12px; color: var(--muted); transition: color 0.15s ease;
    }
    .tab .tab-ic { font-size: 20px; line-height: 1.2; }
    .tab .tab-more { font-size: 20px; line-height: 1.2; font-weight: 700; letter-spacing: 0.05em; }
    .tab span { font: 500 10px/1 var(--font-body); letter-spacing: 0.01em; }
    .tab:hover { color: var(--fg); }
    .tab.is-active { color: var(--accent); }
    .home-indicator {
      position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
      width: 134px; height: 5px; border-radius: 3px;
      background: color-mix(in oklch, var(--fg) 85%, transparent);
    }

    /* ─── снекбар ─────────────────────────────────────────────────── */
    .snackbar {
      position: absolute; left: 18px; right: 18px; bottom: 96px; z-index: 60;
      background: var(--fg); color: var(--surface); border-radius: 16px;
      padding: 12px 15px; font-size: 13px; font-weight: 500;
      display: none; align-items: center; justify-content: space-between; gap: 10px;
      box-shadow: 0 10px 28px color-mix(in oklch, var(--fg) 30%, transparent);
    }
    .snackbar.is-visible { display: flex; }
    .snackbar button { color: var(--accent-light); font-weight: 700; font-size: 13px; padding: 4px 2px; }
  
    /* ═══ Вариант оформления: Vibrant (design-system-vibrant) ═══
       Перебиндиваем базовые токены SaveMoney на контракт Vibrant;
       производные цвета (color-mix от var(--…)) пересчитываются сами. */
    :root {
      --bg: #fff8d7;
      --surface: #ffffff;
      --surface-warm: #ffef9f;
      --fg: #1d1836;
      --fg-2: #4c426c;
      --muted: #796f91;
      --border: #eadfba;
      --accent: #ff6b00;
      --accent-on: #ffffff;
      --success: #2e9d57;
      --warn: #ffb020;
      --danger: #e5484d;

      --expense: #e5484d;
      --income: #2e9d57;
      --transfer: #4c426c;

      --expense-text: color-mix(in srgb, var(--expense) 88%, black);
      --income-text: color-mix(in srgb, var(--income) 72%, black);
      --transfer-text: var(--transfer);
      --accent-text: color-mix(in srgb, var(--accent) 76%, black);
      --accent-light: color-mix(in srgb, var(--accent) 55%, white);
      --cat-cafe: var(--warn);
      --cat-fun: color-mix(in srgb, var(--accent) 60%, var(--fg));
      --cat-cloth: color-mix(in srgb, var(--success) 70%, var(--fg));

      --font-display: 'Inter', 'Segoe UI', system-ui, sans-serif;
      --font-body: 'Inter', 'Segoe UI', system-ui, sans-serif;
    }
    /* мелкий акцентный текст — контрастная производная вместо чистого --accent */
    .tab.is-active, .chip.is-on, .insight, .cat-chip, .guess-hint, .back,
    .achip.is-on, .debt-ava { color: var(--accent-text); }  </style>
</head>
<body>
  <div class="stage">
    <div class="device" data-od-id="device">
      <span class="side-btn action" aria-hidden="true"></span>
      <span class="side-btn vol-up" aria-hidden="true"></span>
      <span class="side-btn vol-down" aria-hidden="true"></span>
      <span class="side-btn power" aria-hidden="true"></span>
      <div class="screen" id="screen">

        <div class="statusbar" data-od-id="status-bar" aria-hidden="true">
          <span class="sb-time">9:41</span>
          <span class="sb-icons">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>

            <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.6" y="0.6" width="20.3" height="10.8" rx="3.2" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4"/><rect x="2.4" y="2.4" width="13.5" height="7.2" rx="1.7" fill="currentColor"/><path d="M22.8 4v4a2.3 2.3 0 0 0 0-4Z" fill="currentColor" opacity="0.4"/></svg>
          </span>
        </div>
        <div class="island" aria-hidden="true"></div>

        <main class="content" data-od-id="input-screen">
          <div class="balance-line" data-od-id="balance-line">
            <span class="lbl">Баланс по счетам</span>
            <span class="val num" id="balance-val">48 250,00 ₽</span>
          </div>

          <div class="seg" role="group" aria-label="Тип операции" data-od-id="type-segments">

            <button type="button" data-type="income" aria-pressed="false">Доход</button>
            <button type="button" data-type="transfer" aria-pressed="false">Перевод</button>
          </div>

          <div class="amount-box" id="amount-box" data-od-id="amount-display" aria-live="polite">
            <span class="amount-val num is-empty" id="amount-val">0</span>
            <span class="amount-cur">₽</span>
          </div>

          <div class="keypad" data-od-id="keypad" aria-label="Цифровая клавиатура">
            <button class="key" data-key="1">1</button>
            <button class="key" data-key="2">2</button>
            <button class="key" data-key="3">3</button>
            <button class="key" data-key="4">4</button>
            <button class="key" data-key="5">5</button>
            <button class="key" data-key="6">6</button>
            <button class="key" data-key="7">7</button>
            <button class="key" data-key="8">8</button>
            <button class="key" data-key="9">9</button>
            <button class="key" data-key=",">,</button>
            <button class="key" data-key="0">0</button>
            <button class="key" data-key="back" aria-label="Стереть">⌫</button>
          </div>

          <div class="group-label" id="acc-label">Счёт</div>
          <div class="chips" id="acc-chips" role="group" aria-labelledby="acc-label"></div>

          <div id="cat-section" data-od-id="category-section">
            <div class="group-label" id="cat-label">Категория</div>
            <div class="chips" id="cat-chips" role="group" aria-labelledby="cat-label"></div>
            <div class="chips" id="sub-chips" role="group" aria-label="Подкатегории" style="margin-top:8px;"></div>
          </div>

          <div id="to-section" style="display:none;">
            <div class="group-label" id="to-label">На счёт</div>
            <div class="chips" id="to-chips" role="group" aria-labelledby="to-label"></div>
          </div>

          <div class="field" id="shop-field">
            <label for="shop-input">Магазин</label>
            <input class="input" id="shop-input" placeholder="Необязательно — по нему угадается категория" autocomplete="off" />
            <span class="guess-hint" id="guess-hint" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="note-input">Заметка</label>
            <input class="input" id="note-input" placeholder="Необязательно" autocomplete="off" />
          </div>
          <div class="field">
            <label for="date-input">Дата</label>
            <button class="date-btn" id="date-btn" type="button">
              <span id="date-label">12 сен 2026</span>
              <span class="chev" aria-hidden="true">▾</span>
            </button>
            <input type="date" id="date-input" value="2026-09-12" />
          </div>

          <button class="btn btn-primary" id="save-btn" data-od-id="save-button">Сохранить</button>
          <button class="btn btn-danger" id="delete-btn" style="display:none;">Удалить операцию</button>
          <p class="edit-note" id="edit-note" style="display:none;">Режим правки: изменения применятся к операции</p>
        </main>

        <nav class="tabbar" data-od-id="tab-bar" aria-label="Основная навигация">
          <a class="tab is-active" href="input.html" aria-current="page">
            <span class="tab-ic" aria-hidden="true">💸</span><span>Ввод</span>
          </a>
          <a class="tab" href="history.html">
            <span class="tab-ic" aria-hidden="true">📋</span><span>История</span>
          </a>
          <a class="tab" href="reports.html">
            <span class="tab-ic" aria-hidden="true">📊</span><span>Отчёты</span>
          </a>
          <a class="tab" href="more.html">
            <span class="tab-more" aria-hidden="true">⋯</span><span>Ещё</span>
          </a>
          <div class="home-indicator" aria-hidden="true"></div>
        </nav>

        <div class="snackbar" id="snackbar" role="status"><span id="snack-text"></span><button id="snack-btn" style="display:none;"></button></div>

      </div>
    </div>
    <p class="stage-caption">iPhone 15 Pro · 393 × 852 · демо-данные · вариант Vibrant</p>
  </div>

        { id: 'b11', off: 2, type: 'expense',  amount: 3200,   emoji: '🚗', name: 'Транспорт',           acc: 'sber',  shop: 'Яндекс Такси',   note: '', cat: 'transport', time: '08:32' },
        { id: 'b12', off: 3, type: 'expense',  amount: 450,    emoji: '🚗', name: 'Транспорт',           acc: 'cash',  shop: 'Такси',          note: '', cat: 'transport', time: '08:30' },
        { id: 'b13', off: 3, type: 'expense',  amount: 3110,   emoji: '🛒', name: 'Продукты',            acc: 'sber',  shop: 'Пятёрочка',      note: '', cat: 'food',      time: '20:05' },
        { id: 'b14', off: 3, type: 'expense',  amount: 1500,   emoji: '🎬', name: 'Развлечения',         acc: 'sber',  shop: 'Кино «Октябрь»', note: '', cat: 'fun',       time: '21:05' },
        { id: 'b15', off: 3, type: 'expense',  amount: 10000,  emoji: '👕', name: 'Одежда',              acc: 'tbank', shop: 'Ozon',           note: 'Кроссовки', cat: 'cloth', time: '16:45' },
        { id: 'b16', off: 4, type: 'expense',  amount: 8900,   emoji: '🛒', name: 'Продукты',            acc: 'sber',  shop: 'Лента',          note: '', cat: 'food',      time: '19:15' },
        { id: 'b17', off: 4, type: 'expense',  amount: 8450,   emoji: '🚗', name: 'Транспорт',           acc: 'tbank', shop: 'Тройка',         note: 'Пакет «Метро»', cat: 'transport', time: '07:50' },
        { id: 'b18', off: 4, type: 'expense',  amount: 4650,   emoji: '☕', name: 'Кафе',                acc: 'cash',  shop: 'Ресторан «Тарелка»', note: '', cat: 'cafe', time: '14:30' }
      ];
      var ACC = {
        sber:  { e: '💳', n: 'Сбер' },
        cash:  { e: '💵', n: 'Наличные' },
        tbank: { e: '💳', n: 'Т-Банк' },
        vault: { e: '🏦', n: 'Вклад' }
      };
      var CATS = {
        expense: [
          { key: 'food',      e: '🛒', n: 'Продукты',  subs: ['Магнит', 'Пятёрочка', 'Рынок'] },
          { key: 'transport', e: '🚗', n: 'Транспорт' },
          { key: 'utilities', e: '🏠', n: 'ЖКХ' },
          { key: 'cafe',      e: '☕', n: 'Кафе' },
          { key: 'health',    e: '💊', n: 'Здоровье' },
          { key: 'fun',       e: '🎬', n: 'Развлечения' },
          { key: 'cloth',     e: '👕', n: 'Одежда' }
        ],
        income: [
          { key: 'salary',    e: '💼', n: 'Зарплата' },
          { key: 'freelance', e: '💻', n: 'Фриланс' },
          { key: 'gift',      e: '🎁', n: 'Подарки' }
        ]
      };
      var RULES_BUILTIN = {
        'пятёрочка': 'food', 'магнит': 'food', 'лента': 'food', 'азбука': 'food', 'рынок': 'food',
        'сбермаркет': 'food', 'кофемания': 'cafe', 'кофе': 'cafe', 'такси': 'transport',
        'яндекс': 'transport', 'метро': 'transport', 'тройка': 'transport', 'аптека': 'health',
        'горздрав': 'health', 'мосэнергосбыт': 'utilities', 'жкх': 'utilities', 'кино': 'fun',
        'октябрь': 'fun', 'wildberries': 'cloth', 'ozon': 'cloth', 'озон': 'cloth'
      };

      var store = {
        ops: [],
        load: function () {
          try {
            var v = JSON.parse(localStorage.getItem('sm-ops-v1'));
            if (Array.isArray(v) && v.length) { this.ops = v; return; }
          } catch (e) { /* пустое хранилище — сеем базу */ }
          this.ops = JSON.parse(JSON.stringify(SEED));
          this.save();
        },
        save: function () {
          try { localStorage.setItem('sm-ops-v1', JSON.stringify(this.ops)); } catch (e) { /* приватный режим */ }
        },
        get: function (id) { return this.ops.filter(function (o) { return o.id === id; })[0]; },
        remove: function (id) {
          this.ops = this.ops.filter(function (o) { return o.id !== id; });
          this.save();
        },
        upsert: function (op) {
          var i = this.ops.findIndex(function (o) { return o.id === op.id; });
          if (i >= 0) this.ops[i] = op; else this.ops.unshift(op);
          this.save();
        }
      };
      var customBalance = function () {
        var d = 0;
        store.ops.forEach(function (o) {
          if (o.id.charAt(0) !== 'c') return;
          if (o.type === 'income') d += o.amount;
          if (o.type === 'expense') d -= o.amount;
        });
        return d;
      };
      var fmt2 = function (n) { return n.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ₽'; };

      function lsGet(k, fb) {
        try { var v = localStorage.getItem(k); return v === null ? fb : v; } catch (e) { return fb; }
      }
      function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* приватный режим */ } }

      /* ── состояние ── */
      var state = {
        type: 'expense', amountStr: '', acc: 'sber', acc2: 'cash',
        cat: 'food', sub: '', shop: '', note: '', date: '2026-09-12',
        editId: null
      };
      var editing = null;
      var params = new URLSearchParams(location.search);
      if (params.get('edit')) {
        store.load();
        editing = store.get(params.get('edit'));
      }

      var $ = function (id) { return document.getElementById(id); };

      /* ── баланс ── */
      function renderBalance() {
        store.load();
        var total = 48250 + customBalance();
        $('balance-val').textContent = fmt2(total);
      }

      /* ── сумма ── */
      function renderAmount() {
        var el = $('amount-val');
        if (!state.amountStr) {
          el.textContent = '0';
          el.classList.add('is-empty');
          return;
        }
        el.classList.remove('is-empty');
        var parts = state.amountStr.split(',');
        var int = (parts[0] || '0').replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
        el.textContent = parts.length > 1 ? int + ',' + parts[1] : int;
      }
      function pressKey(k) {
        if (k === 'back') {
          state.amountStr = state.amountStr.slice(0, -1);
        } else if (k === ',') {
          if (state.amountStr.indexOf(',') < 0) state.amountStr = (state.amountStr || '0') + ',';
        } else {
          var parts = state.amountStr.split(',');
          if (parts.length === 2 && parts[1].length >= 2) return;
          if (state.amountStr.replace(',', '').length >= 9) return;
          if (state.amountStr === '0') state.amountStr = k;
          else state.amountStr += k;
        }
        renderAmount();
      }
      document.querySelector('.keypad').addEventListener('click', function (e) {
        var b = e.target.closest('.key');
        if (b) pressKey(b.dataset.key);
      });
      (function () { /* удержание ⌫ — очистить всю сумму */
        var t;
        var back = document.querySelector('[data-key="back"]');
        back.addEventListener('pointerdown', function () {
          t = setTimeout(function () { state.amountStr = ''; renderAmount(); }, 500);
        });
        ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) {
          back.addEventListener(ev, function () { clearTimeout(t); });
        });
      })();

      /* ── сегменты ── */
      var lastCat = { expense: 'food', income: 'salary', transfer: '' };
      try {
        var saved = JSON.parse(localStorage.getItem('sm-lastcat') || '{}');
        if (saved.expense) lastCat.expense = saved.expense;
        if (saved.income) lastCat.income = saved.income;
      } catch (e) { /* нет памяти — значения по умолчанию */ }

      function setType(t, keepCat) {
        state.type = t;
        document.querySelectorAll('.seg button').forEach(function (b) {
          var on = b.dataset.type === t;
          b.classList.toggle('is-on', on);
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        var isTransfer = t === 'transfer';
        $('cat-section').style.display = isTransfer ? 'none' : '';
        $('to-section').style.display = isTransfer ? '' : 'none';
        $('shop-field').style.display = isTransfer ? 'none' : '';
        document.querySelector('.amount-cur').textContent = '₽';
        renderAccChips();
        if (!isTransfer) {
          renderCatChips(keepCat ? state.cat : lastCat[t]);
          renderSubChips();
        }
      }
      document.querySelector('.seg').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-type]');
        if (b) setType(b.dataset.type, false);
      });

      /* ── чипы счетов ── */
      function chipEl(label, isOn, onClick) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip' + (isOn ? ' is-on' : '');
        b.textContent = label;
        b.setAttribute('aria-pressed', isOn ? 'true' : 'false');
        b.addEventListener('click', onClick);
        return b;
      }
      function renderAccChips() {
        var box = $('acc-chips');
        box.innerHTML = '';
        Object.keys(ACC).forEach(function (k) {
          box.appendChild(chipEl(ACC[k].e + ' ' + ACC[k].n, state.acc === k, function () {
            state.acc = k;
            renderAccChips();
            if (state.type === 'transfer') renderToChips();
          }));
        });
      }
      function renderToChips() {
        var box = $('to-chips');
        box.innerHTML = '';
        if (!ACC[state.acc2] || state.acc2 === state.acc) state.acc2 = Object.keys(ACC).filter(function (k) { return k !== state.acc; })[0];
        Object.keys(ACC).forEach(function (k) {
          if (k === state.acc) return;
          box.appendChild(chipEl(ACC[k].e + ' ' + ACC[k].n, state.acc2 === k, function () {
            state.acc2 = k;
            renderToChips();
            maybeInstantSave();
          }));
        });
      }

      /* ── чипы категорий + подкатегории ── */
      function renderCatChips(selected) {
        state.cat = selected;
        var box = $('cat-chips');
        box.innerHTML = '';
        CATS[state.type].forEach(function (c) {
          box.appendChild(chipEl(c.e + ' ' + c.n, state.cat === c.key, function () {
            renderCatChips(c.key);
            renderSubChips();
            lastCat[state.type] = c.key;
            lsSet('sm-lastcat', JSON.stringify(lastCat));
            maybeInstantSave();
          }));
        });
      }
      function catMeta() {
        return CATS[state.type].filter(function (c) { return c.key === state.cat; })[0] || CATS[state.type][0];
      }
      function renderSubChips() {
        var box = $('sub-chips');
        box.innerHTML = '';
        var c = catMeta();
        if (!c.subs) { box.style.display = 'none'; return; }
        box.style.display = '';
        c.subs.forEach(function (s) {
          box.appendChild(chipEl(s, state.sub === s, function () {
            state.sub = state.sub === s ? '' : s;
            renderSubChips();
            maybeInstantSave();
          }));
        });
      }

      /* ── магазин угадывает категорию ── */
      var guessTimer;
      $('shop-input').addEventListener('input', function () {
        state.shop = this.value.trim();
        clearTimeout(guessTimer);
        guessTimer = setTimeout(guessCategory, 250);
      });
      function learnedRules() {
        try { return JSON.parse(localStorage.getItem('sm-rules') || '{}'); } catch (e) { return {}; }
      }
      function guessCategory() {
        var q = state.shop.toLowerCase();
        if (q.length < 3) { $('guess-hint').classList.remove('is-visible'); return; }
        var learned = learnedRules();
        var hit = learned[q] || (Object.keys(learned).filter(function (k) { return q.indexOf(k) >= 0; })[0] && learned[Object.keys(learned).filter(function (k) { return q.indexOf(k) >= 0; })[0]]);
        if (!hit) {
          var builtinKey = Object.keys(RULES_BUILTIN).filter(function (k) { return q.indexOf(k) >= 0; })[0];
          hit = builtinKey ? RULES_BUILTIN[builtinKey] : null;
        }
        if (hit && hit !== state.cat) {
          renderCatChips(hit);
          renderSubChips();
          var meta = catMeta();
          var hint = $('guess-hint');
          hint.textContent = 'Угадана категория: ' + meta.e + ' ' + meta.n;
          hint.classList.add('is-visible');
          setTimeout(function () { hint.classList.remove('is-visible'); }, 3500);
        }
      }

      /* ── дата ── */
      var MONTHS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
      function renderDate() {
        var p = state.date.split('-');
        $('date-label').textContent = +p[2] + ' ' + MONTHS[+p[1] - 1] + ' ' + p[0];
      }
      $('date-btn').addEventListener('click', function () {
        var inp = $('date-input');
        if (inp.showPicker) inp.showPicker(); else inp.focus();
      });
      $('date-input').addEventListener('change', function () {
        if (this.value) { state.date = this.value; renderDate(); }
      });

      /* ── сохранение / правка / удаление ── */
      function amountNum() {
        var v = parseFloat(state.amountStr.replace(',', '.'));
        return isFinite(v) ? Math.round(v * 100) / 100 : 0;
      }
      function snack(text, actionLabel, action) {
        var bar = $('snackbar');
        $('snack-text').textContent = text;
        var btn = $('snack-btn');
        if (actionLabel) {
          btn.style.display = '';
          btn.textContent = actionLabel;
          btn.onclick = function () { action(); bar.classList.remove('is-visible'); };
        } else { btn.style.display = 'none'; btn.onclick = null; }
        bar.classList.add('is-visible');
        clearTimeout(snack.t);
        snack.t = setTimeout(function () { bar.classList.remove('is-visible'); }, 4000);
      }
      function applyEditToForm(op) {
        state.type = op.type;
        state.acc = op.acc;
        state.acc2 = op.acc2 || 'cash';
        state.cat = op.cat || CATS[op.type][0].key;
        state.sub = '';
        state.shop = op.shop || '';
        state.note = op.note || '';
        state.date = '2026-09-' + (12 - op.off < 1 ? '0' : '') + (12 - op.off);
        state.amountStr = String(op.amount);
        setType(op.type, true);
        $('shop-input').value = state.shop;
        $('note-input').value = state.note;
        renderAmount();
        renderDate();
      }
      function maybeInstantSave() {
        if (lsGet('sm-instant', '0') !== '1') return;
        if (state.editId) return;
        if (amountNum() > 0) saveOperation(true);
      }
      function saveOperation(silent) {
        var amount = amountNum();
        if (amount <= 0) {
          var box = $('amount-box');
          box.classList.remove('shake');
          void box.offsetWidth;
          box.classList.add('shake');
          snack('Введите сумму — цифры на клавиатуре выше');
          return;
        }
        if (state.type === 'transfer' && state.acc === state.acc2) {
          snack('Счёт списания и зачисления совпадают');
          return;
        }
        store.load();
        var op;
        if (state.editId && editing) {
          op = editing;
          op.type = state.type; op.amount = amount; op.acc = state.acc;
          op.acc2 = state.type === 'transfer' ? state.acc2 : '';
          op.emoji = state.type === 'transfer' ? '🔁' : catMeta().e;
          op.name = state.type === 'transfer' ? ACC[state.acc].n + ' → ' + ACC[state.acc2].n : catMeta().n;
          op.shop = state.type === 'transfer' ? '' : state.shop;
          op.note = state.note;
          op.cat = state.type === 'transfer' ? '' : state.cat;
        } else {
          var now = new Date();
          var time = ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2);
          op = {
            id: 'c' + Date.now(), off: 0, type: state.type, amount: amount,
            emoji: state.type === 'transfer' ? '🔁' : catMeta().e,
            name: state.type === 'transfer' ? ACC[state.acc].n + ' → ' + ACC[state.acc2].n : catMeta().n + (state.sub ? ' · ' + state.sub : ''),
            acc: state.acc, acc2: state.type === 'transfer' ? state.acc2 : '',
            shop: state.type === 'transfer' ? '' : state.shop,
            note: state.note,
            cat: state.type === 'transfer' ? '' : state.cat,
            time: time
          };
          /* обучение правила магазин → категория */
          if (state.shop && state.type === 'expense') {
            var rules = learnedRules();
            rules[state.shop.toLowerCase()] = state.cat;
            lsSet('sm-rules', JSON.stringify(rules));
          }
        }
        store.upsert(op);
        renderBalance();
        if (!silent) {
          var btn = $('save-btn');
          btn.classList.add('is-saved');
          btn.textContent = '✓ Сохранено';
          setTimeout(function () {
            btn.classList.remove('is-saved');
            btn.textContent = 'Сохранить';
          }, 1200);
        }
        state.amountStr = '';
        state.sub = '';
        renderAmount();
        $('shop-input').value = '';
        $('note-input').value = '';
        state.shop = ''; state.note = '';
        if (state.editId) {
          setTimeout(function () { location.href = 'history.html'; }, 600);
        }
      }
      $('save-btn').addEventListener('click', function () { saveOperation(false); });
      $('delete-btn').addEventListener('click', function () {
        if (state.editId) {
          store.remove(state.editId);
          location.href = 'history.html';
        }
      });

      /* ── старт ── */
      store.load();
      renderBalance();
      renderAccChips();
      setType(state.type, false);
      renderAmount();
      renderDate();
      if (editing) {
        state.editId = editing.id;
        applyEditToForm(editing);
        $('save-btn').textContent = 'Сохранить изменения';
        $('delete-btn').style.display = '';
        $('edit-note').style.display = '';
      }
    })();
  </script>
</body>
</html>
